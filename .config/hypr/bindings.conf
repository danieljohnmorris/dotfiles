# Application bindings
bindd = SUPER, RETURN, Terminal, exec, ghostty --working-directory=/home/dan/code
bindd = SUPER ALT, RETURN, Terminal (tmux), exec, ghostty -e tmux new
bindd = SUPER SHIFT, RETURN, Browser, exec, firefox
bindd = SUPER SHIFT, F, File manager, exec, nautilus --new-window
bindd = SUPER SHIFT, N, Editor, exec, ghostty -e nvim
bindd = SUPER SHIFT, T, Activity, exec, ghostty -e btop
bindd = SUPER SHIFT, L, Claude Code, exec, ghostty -e claude --dangerously-skip-permissions

# Close windows
bindd = SUPER, W, Close window, killactive,
bindd = SUPER SHIFT, Q, Force kill window, exec, hyprctl kill

# Tiling
bindd = SUPER, J, Toggle window split, layoutmsg, togglesplit
bindd = SUPER, P, Pseudo window, pseudo,
bindd = SUPER, T, Toggle window floating/tiling, togglefloating,
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER ALT, F, Full width, fullscreen, 1

# Move focus with SUPER + arrow keys
bindd = SUPER, LEFT, Move focus left, movefocus, l
bindd = SUPER, RIGHT, Move focus right, movefocus, r
bindd = SUPER, UP, Move focus up, movefocus, u
bindd = SUPER, DOWN, Move focus down, movefocus, d

# Switch workspaces with SUPER + [1-9; 0]
bindd = SUPER, code:10, Workspace 1, workspace, 1
bindd = SUPER, code:11, Workspace 2, workspace, 2
bindd = SUPER, code:12, Workspace 3, workspace, 3
bindd = SUPER, code:13, Workspace 4, workspace, 4
bindd = SUPER, code:14, Workspace 5, workspace, 5
bindd = SUPER, code:15, Workspace 6, workspace, 6
bindd = SUPER, code:16, Workspace 7, workspace, 7
bindd = SUPER, code:17, Workspace 8, workspace, 8
bindd = SUPER, code:18, Workspace 9, workspace, 9
bindd = SUPER, code:19, Workspace 10, workspace, 10

# Move window to workspace with SUPER + SHIFT + [1-9; 0]
bindd = SUPER SHIFT, code:10, Move to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move to workspace 10, movetoworkspace, 10

# Move window silently to workspace
bindd = SUPER SHIFT ALT, code:10, Move silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, code:11, Move silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, code:12, Move silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, code:13, Move silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, code:14, Move silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, code:15, Move silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, code:16, Move silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, code:17, Move silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, code:18, Move silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, code:19, Move silently to workspace 10, movetoworkspacesilent, 10

# Scratchpad
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move to scratchpad, movetoworkspacesilent, special:scratchpad

# TAB between workspaces
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Former workspace, workspace, previous

# Move workspaces to other monitors
bindd = SUPER SHIFT ALT, LEFT, Move workspace left, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, RIGHT, Move workspace right, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, UP, Move workspace up, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, DOWN, Move workspace down, movecurrentworkspacetomonitor, d

# Swap windows
bindd = SUPER SHIFT, LEFT, Swap window left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap window right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d

# Alt-tab
bindd = ALT, TAB, Cycle next window, cyclenext
bindd = ALT SHIFT, TAB, Cycle prev window, cyclenext, prev
bindd = ALT, TAB, Bring active to top, bringactivetotop
bindd = ALT SHIFT, TAB, Bring active to top, bringactivetotop

# Resize
bindd = SUPER, code:20, Shrink width, resizeactive, -100 0
bindd = SUPER, code:21, Grow width, resizeactive, 100 0
bindd = SUPER SHIFT, code:20, Shrink height, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Grow height, resizeactive, 0 100

# Mouse bindings
bindd = SUPER, mouse_down, Scroll workspace forward, workspace, e+1
bindd = SUPER, mouse_up, Scroll workspace backward, workspace, e-1
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# Groups
bindd = SUPER, G, Toggle group, togglegroup
bindd = SUPER ALT, G, Move out of group, moveoutofgroup
bindd = SUPER ALT, LEFT, Move to group left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move to group right, moveintogroup, r
bindd = SUPER ALT, UP, Move to group up, moveintogroup, u
bindd = SUPER ALT, DOWN, Move to group down, moveintogroup, d
bindd = SUPER ALT, TAB, Next in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Prev in group, changegroupactive, b

# Copy / Cut
bindd = SUPER, X, Cut, sendshortcut, CTRL, X,

# Media keys
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = ,XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ,XF86AudioMicMute, Mute mic, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl set +5%
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# App launcher
bindd = SUPER, SPACE, App launcher, exec, walker

# Notifications
bindd = SUPER, COMMA, Dismiss notification, exec, swaync-client -d
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, swaync-client -C
bindd = SUPER, N, Notification center, exec, swaync-client -t

# Screenshot
bindd = , PRINT, Screenshot, exec, f=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && grim -g "$(slurp)" "$f" && wl-copy < "$f"
bindd = SHIFT, PRINT, Screenshot full, exec, f=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && grim "$f" && wl-copy < "$f"
bindd = SUPER SHIFT, S, Screenshot, exec, f=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && grim -g "$(slurp)" "$f" && wl-copy < "$f"

# Wallpaper picker
bindd = SUPER SHIFT, W, Wallpaper picker, exec, ~/.scripts/wallpick.sh
bindd = SUPER SHIFT ALT, W, Random wallpaper, exec, ~/.scripts/random-wall.sh

# Lock
bindd = SUPER CTRL, L, Lock screen, exec, hyprlock

# Toggle waybar
bindd = SUPER SHIFT, SPACE, Toggle waybar, exec, pkill waybar || waybar &

# Center toggle
bindd = SUPER, C, Copy, sendshortcut, CTRL, C,
bindd = SUPER SHIFT, C, Center window, exec, ~/.local/bin/hypr-center-toggle

# Power menu
bindld = , XF86PowerOff, Power menu, exec, notify-send "Power" "Use: systemctl suspend/poweroff/reboot"
bindd = SUPER, ESCAPE, Logout, exit,
